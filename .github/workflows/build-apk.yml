
name: Construire ARBEON CTM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Décompresser le projet
        run: |
          unzip -o arbeon_ctm_android_source.zip
          ls -la
          ls -la arbeon_ctm_android

      - name: Compiler l'application
        run: |
          cd arbeon_ctm_android
          gradle assembleDebug

      - name: Publier le fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: arbeon-ctm-apk
          path: arbeon_ctm_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
