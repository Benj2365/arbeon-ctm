
name: Construire ARBEON CTM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - name: Accepter les licences Android
        run: yes | sdkmanager --licenses
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Décompresser le projet
        run: |
          unzip arbeon_ctm_android_source.zip
          ls

      - name: Compiler l'application
        run: |
          cd arbeon_ctm_android
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: arbeon-ctm-apk
          path: arbeon_ctm_android/app/build/outputs/apk/debug/app-debug.apk
          
